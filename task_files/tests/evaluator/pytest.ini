# Pin the verifier's pytest configuration.
#
# test.sh passes this file with -c so that the evaluator behaves the same way
# whatever directory it is started from: without it, pytest would pick up the
# configuration of whatever project happens to be above the working directory,
# which for this task is the build under test.
[pytest]
addopts = -q -p no:cacheprovider
console_output_style = classic
